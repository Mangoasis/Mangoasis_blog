<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182550"/>
      <stop offset="0.30" stop-color="#33619f"/>
      <stop offset="0.55" stop-color="#6f9ad8"/>
      <stop offset="0.75" stop-color="#a9ace4"/>
      <stop offset="0.90" stop-color="#d9b3d4"/>
      <stop offset="1" stop-color="#f0c3ce"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d5" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffe4a6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe4a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db4ea"/>
      <stop offset="1" stop-color="#c0cdf2"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#687fca"/>
      <stop offset="1" stop-color="#8ea4e0"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4d96"/>
      <stop offset="1" stop-color="#5768b2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d9ec" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8d9ec" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blur24" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- 天空 -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="2.2" opacity="0.9"/>
    <circle cx="320" cy="150" r="1.6" opacity="0.7"/>
    <circle cx="520" cy="60" r="2.6" opacity="0.85"/>
    <circle cx="700" cy="130" r="1.4" opacity="0.6"/>
    <circle cx="880" cy="70" r="2" opacity="0.8"/>
    <circle cx="1040" cy="160" r="1.5" opacity="0.55"/>
    <circle cx="1240" cy="90" r="2.3" opacity="0.8"/>
    <circle cx="1420" cy="150" r="1.7" opacity="0.65"/>
    <circle cx="1510" cy="60" r="2" opacity="0.75"/>
    <circle cx="220" cy="240" r="1.5" opacity="0.5"/>
    <circle cx="430" cy="200" r="1.2" opacity="0.45"/>
    <circle cx="640" cy="250" r="1.6" opacity="0.5"/>
    <circle cx="960" cy="210" r="1.3" opacity="0.4"/>
    <circle cx="1330" cy="230" r="1.5" opacity="0.5"/>
  </g>

  <!-- 月亮与光晕 -->
  <circle cx="1170" cy="290" r="250" fill="url(#sun)"/>
  <circle cx="1170" cy="290" r="62" fill="#fff3cc" opacity="0.92" filter="url(#blur10)"/>
  <circle cx="1170" cy="290" r="46" fill="#fffbe8" opacity="0.98"/>

  <!-- 云海 -->
  <g fill="#ffffff" filter="url(#blur24)">
    <ellipse cx="260" cy="360" rx="230" ry="42" opacity="0.34"/>
    <ellipse cx="480" cy="320" rx="170" ry="32" opacity="0.28"/>
    <ellipse cx="90"  cy="430" rx="180" ry="36" opacity="0.3"/>
    <ellipse cx="1330" cy="420" rx="220" ry="40" opacity="0.3"/>
    <ellipse cx="1490" cy="360" rx="150" ry="30" opacity="0.26"/>
    <ellipse cx="820" cy="270" rx="140" ry="26" opacity="0.22"/>
    <ellipse cx="1080" cy="480" rx="200" ry="36" opacity="0.28"/>
    <ellipse cx="380" cy="500" rx="240" ry="40" opacity="0.26"/>
  </g>

  <!-- 蝴蝶剪影 -->
  <g transform="translate(500 285) rotate(-14) scale(1.25)" fill="#26325f" opacity="0.9">
    <path d="M0 0 C -34 -58, -104 -62, -118 -14 C -126 18, -72 32, -8 12 C -66 38, -78 92, -40 98 C -6 103, 2 58, 0 28 C -2 58, -10 103, 24 98 C 62 92, 50 38, -8 12 C 56 32, 110 18, 102 -14 C 88 -62, 18 -58, -16 0 Z" transform="scale(-1 1)"/>
    <path d="M0 0 C -34 -58, -104 -62, -118 -14 C -126 18, -72 32, -8 12 C -66 38, -78 92, -40 98 C -6 103, 2 58, 0 28 C -2 58, -10 103, 24 98 C 62 92, 50 38, -8 12 C 56 32, 110 18, 102 -14 C 88 -62, 18 -58, -16 0 Z"/>
    <ellipse cx="0" cy="18" rx="3.4" ry="16"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#2c3a6e" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M760 200 q 14 -12 28 0 q 14 -12 28 0"/>
    <path d="M860 240 q 11 -9 22 0 q 11 -9 22 0"/>
  </g>

  <!-- 远山 -->
  <path fill="url(#m1)" opacity="0.95" d="M0 700 L130 620 L260 690 L420 580 L560 660 L720 560 L880 640 L1040 570 L1200 650 L1360 590 L1500 660 L1600 610 L1600 1000 L0 1000 Z"/>
  <!-- 中山 -->
  <path fill="url(#m2)" d="M0 780 L180 680 L340 760 L520 640 L700 730 L880 620 L1060 720 L1240 640 L1420 740 L1600 670 L1600 1000 L0 1000 Z"/>
  <!-- 雾带 -->
  <rect y="700" width="1600" height="160" fill="url(#mist)"/>
  <!-- 近山 -->
  <path fill="url(#m3)" d="M0 900 L200 800 L380 880 L560 770 L760 870 L960 760 L1160 860 L1360 780 L1600 880 L1600 1000 L0 1000 Z"/>
  <!-- 前景剪影地面 -->
  <path fill="#232c56" d="M0 970 Q 200 930 420 960 T 860 955 T 1300 960 T 1600 950 L1600 1000 L0 1000 Z"/>
</svg>
