<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <style>
    .rays { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .c1 { animation: drift1 8s ease-in-out infinite alternate; }
    .c2 { animation: drift1 11s ease-in-out infinite alternate-reverse; }
    @keyframes drift1 { to { transform: translateX(30px); } }
    .bird { animation: bob 3s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-8px); } }
  </style>
  <rect width="800" height="450" fill="#FFE9D2"/>
  <g class="safe-band" transform="translate(400 225) scale(0.8) translate(-400 -225)">
  <g class="rays" stroke="#ff9f43" stroke-width="6" stroke-linecap="round">
    <line x1="620" y1="40" x2="620" y2="66"/><line x1="620" y1="154" x2="620" y2="180"/>
    <line x1="550" y1="110" x2="576" y2="110"/><line x1="664" y1="110" x2="690" y2="110"/>
    <line x1="570" y1="60" x2="588" y2="78"/><line x1="652" y1="142" x2="670" y2="160"/>
    <line x1="670" y1="60" x2="652" y2="78"/><line x1="588" y1="142" x2="570" y2="160"/>
  </g>
  <circle cx="620" cy="110" r="38" fill="#ffcf6e" stroke="#ff9f43" stroke-width="6"/>
  <g class="c1" fill="#fff" stroke="#8fb8de" stroke-width="5" stroke-linejoin="round">
    <path d="M170 150 q -12 -34 22 -34 q 8 -26 42 -20 q 34 -30 62 0 q 34 -4 30 28 q 26 10 6 30 z"/>
  </g>
  <g class="c2" fill="#fff" stroke="#8fb8de" stroke-width="5" stroke-linejoin="round">
    <path d="M370 90 q -10 -28 18 -28 q 6 -20 34 -16 q 28 -24 50 0 q 28 -2 24 22 q 20 8 4 24 z"/>
  </g>
  <g class="bird" stroke="#5a6b7f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M300 210 q 16 -14 32 0 q 16 -14 32 0"/>
  </g>
  <g fill="#fff" stroke="#f0a860" stroke-width="6" stroke-linejoin="round">
    <path d="M0 450 L0 380 Q 200 330 400 375 T 800 370 L800 450 Z"/>
    <path d="M0 450 L0 420 Q 260 380 520 415 T 800 408 L800 450 Z" stroke="#8fb8de"/>
  </g>
</g>
</svg>
