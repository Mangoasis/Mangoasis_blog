<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <style>
    .b1 { transform-box: fill-box; transform-origin: center; animation: bob1 4s ease-in-out infinite alternate; }
    .b2 { animation: bob1 5s 0.6s ease-in-out infinite alternate; }
    .b3 { animation: bob1 4.5s 1.1s ease-in-out infinite alternate; }
    @keyframes bob1 { to { transform: translateY(-16px); } }
    .cloud { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translateX(24px); } }
  </style>
  <rect width="800" height="450" fill="#FCE4EC"/>
  <g class="safe-band" transform="translate(400 225) scale(0.8) translate(-400 -225)">
  <g class="cloud" fill="#fff" stroke="#f8bbd0" stroke-width="5" stroke-linejoin="round">
    <path d="M120 120 q -10 -28 20 -28 q 8 -20 36 -16 q 26 -22 46 2 q 28 -2 24 22 q 18 8 4 22 z"/>
  </g>
  <g stroke-linecap="round">
    <g class="b1">
      <path d="M250 210 Q 250 120 320 120 Q 390 120 390 210 Q 390 268 320 268 Q 250 268 250 210" fill="#f48fb1" stroke="#ec407a" stroke-width="6"/>
      <path d="M320 268 L312 320 M320 268 L332 316" fill="none" stroke="#8d6e63" stroke-width="3.5"/>
    </g>
    <g class="b2">
      <path d="M430 170 Q 430 80 500 80 Q 570 80 570 170 Q 570 228 500 228 Q 430 228 430 170" fill="#81d4fa" stroke="#4fc3f7" stroke-width="6"/>
      <path d="M500 228 L492 280 M500 228 L512 276" fill="none" stroke="#8d6e63" stroke-width="3.5"/>
    </g>
    <g class="b3">
      <path d="M600 240 Q 600 150 665 150 Q 730 150 730 240 Q 730 296 665 296 Q 600 296 600 240" fill="#ffe28f" stroke="#f4b942" stroke-width="6"/>
      <path d="M665 296 L657 346 M665 296 L677 342" fill="none" stroke="#8d6e63" stroke-width="3.5"/>
    </g>
  </g>
  <g fill="none" stroke="#5a6b7f" stroke-width="5" stroke-linecap="round">
    <path d="M0 430 Q 100 414 200 428 T 400 426 T 600 424 T 800 426"/>
  </g>
</g>
</svg>
