<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="clover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee08e"/>
      <stop offset="0.55" stop-color="#4caf50"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8b40"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>

  <!-- 茎 -->
  <path d="M33 34 C 31 42, 27 49, 20 56" stroke="url(#stem)" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- 四片心形叶片（幸运草） -->
  <g transform="translate(31.5 29)">
    <g fill="url(#clover)" stroke="#2e7d32" stroke-width="0.8" stroke-opacity="0.35">
      <path d="M0 0 C -13 -11, -13 -22, -6.5 -24.5 C -2 -26, 0 -22.5, 0 -20 C 0 -22.5, 2 -26, 6.5 -24.5 C 13 -22, 13 -11, 0 0 Z"/>
      <path d="M0 0 C -13 -11, -13 -22, -6.5 -24.5 C -2 -26, 0 -22.5, 0 -20 C 0 -22.5, 2 -26, 6.5 -24.5 C 13 -22, 13 -11, 0 0 Z" transform="rotate(90)"/>
      <path d="M0 0 C -13 -11, -13 -22, -6.5 -24.5 C -2 -26, 0 -22.5, 0 -20 C 0 -22.5, 2 -26, 6.5 -24.5 C 13 -22, 13 -11, 0 0 Z" transform="rotate(180)"/>
      <path d="M0 0 C -13 -11, -13 -22, -6.5 -24.5 C -2 -26, 0 -22.5, 0 -20 C 0 -22.5, 2 -26, 6.5 -24.5 C 13 -22, 13 -11, 0 0 Z" transform="rotate(270)"/>
    </g>

    <!-- 叶片高光 -->
    <ellipse cx="-4.5" cy="-13" rx="2.6" ry="4" fill="rgba(255,255,255,0.4)" transform="rotate(-18 -4.5 -13)"/>
    <ellipse cx="13" cy="-4.5" rx="4" ry="2.6" fill="rgba(255,255,255,0.28)" transform="rotate(72 13 -4.5)"/>

    <!-- 中心点缀 -->
    <circle cx="0" cy="0" r="2.2" fill="#1b5e20" opacity="0.55"/>
  </g>

  <!-- 小闪光：幸运 -->
  <g fill="#a5d6a7">
    <path d="M52 10 l1.4 3.4 3.4 1.4 -3.4 1.4 -1.4 3.4 -1.4 -3.4 -3.4 -1.4 3.4 -1.4 Z" opacity="0.9"/>
    <circle cx="10" cy="14" r="1.8" opacity="0.7"/>
  </g>
</svg>
